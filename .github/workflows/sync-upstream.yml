name: Sync upstream while preserving Safari extension

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'diyarit/Spotify-Taurus'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SYNC_BRANCH: automation/sync-upstream
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch official Taurus from GitLab
        run: |
          git remote add upstream https://gitlab.com/taurustweak/taurus.git
          git fetch upstream main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Merge upstream into the sync branch
        id: merge
        run: bash scripts/sync-upstream.sh

      - name: Push the sync branch and open a reviewable PR
        if: steps.merge.outputs.changed == 'true'
        run: |
          git push origin "$SYNC_BRANCH"
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            cat > "$RUNNER_TEMP/sync-body.md" <<'BODY'
          Merges official GitLab Taurus updates into this fork while retaining its Safari extension and build integration.

          Review the changes and the **Safari link extension checks** workflow on this branch before merging. Merge conflicts stop synchronization without changing main. The IPA build workflow verifies that packaged Safari resources still match this fork.
          BODY
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$SYNC_BRANCH" \
              --title 'chore: sync upstream Taurus updates' --body-file "$RUNNER_TEMP/sync-body.md"
          fi
          # GITHUB_TOKEN pushes do not trigger push/PR checks. Dispatch them explicitly.
          gh workflow run test-safari.yml --repo "$GITHUB_REPOSITORY" --ref "$SYNC_BRANCH"
