name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "HTTPS link to your decrypted Spotify IPA (optional if SPOTIFY_IPA_URL secret is set)"
        required: false
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: false

env:
  THEOS: ${{ github.workspace }}/out/theos

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Check source URL
        env:
          SAVED_IPA_URL: ${{ secrets.SPOTIFY_IPA_URL }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.parse import urlsplit
          with open(os.environ['GITHUB_EVENT_PATH']) as event_file:
              event = json.load(event_file)
          value = event.get('inputs', {}).get('ipa_url') or os.environ.get('SAVED_IPA_URL', '')
          try:
              parsed = urlsplit(value)
              valid = parsed.scheme == 'https' and parsed.hostname and not any(c in value for c in '\r\n')
          except ValueError:
              valid = False
          if not valid:
              raise SystemExit('Provide an HTTPS ipa_url or set the SPOTIFY_IPA_URL repository secret.')
          # Escape workflow command data before registering the mask.
          print('::add-mask::' + value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Safari routing and packaging
        run: make test-safari

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: out/theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m venv out/build-tools
          out/build-tools/bin/pip install 'git+https://github.com/asdfzxcvbn/pyzule-rw.git'
          echo "$GITHUB_WORKSPACE/out/build-tools/bin" >> "$GITHUB_PATH"

      - name: Download IPA
        env:
          SAVED_IPA_URL: ${{ secrets.SPOTIFY_IPA_URL }}
        run: |
          mkdir -p ipa
          IPA_SOURCE_URL="$(python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"])).get("inputs", {}).get("ipa_url") or os.environ.get("SAVED_IPA_URL", ""))')"
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 30 \
            --proto '=https' --proto-redir '=https' "$IPA_SOURCE_URL" -o ipa/spotify.ipa
          python3 - <<'PY'
          import zipfile
          if not zipfile.is_zipfile('ipa/spotify.ipa'):
              raise SystemExit('Downloaded file is not an IPA/ZIP archive. Use a direct download URL.')
          PY

      - name: Build Taurus with Safari extension
        run: make release SAFARI=1

      - name: Verify packaged Safari extension
        run: |
          for artifact in out/Taurus-*.ipa; do
            python3 scripts/check-safari-ipa.py "$artifact"
          done

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: Taurus-Safari-${{ github.run_number }}
          path: out/Taurus-*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="spotifyglass-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for artifact in out/Taurus-*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$artifact" "https://filebin.net/$BIN/$(basename "$artifact")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$artifact")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove source IPA
        if: always()
        run: rm -f ipa/spotify.ipa
